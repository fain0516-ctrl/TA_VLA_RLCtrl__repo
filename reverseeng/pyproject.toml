[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverseeng"
version = "0.1.0"
description = "리버스.ENG skeleton: read-only device profiling published over MQTT"
requires-python = ">=3.9"
dependencies = ["paho-mqtt>=2.0", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
reverseeng = "reverseeng.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reverseeng.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
